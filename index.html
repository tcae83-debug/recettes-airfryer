<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recettes Airfryer</title>
<meta name="description" content="Recettes et conseils pour la friteuse sans huile Valberg VAL-AF11.5LFLEX">
<meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recettes Airfryer">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6efe6;--card:#fffaf4;--ink:#2b211b;--muted:#7a6a5e;--line:#eadfd2;
  --accent:#e2622b;--accent2:#f29a3d;--soft:#fde6d6;--ok:#2f8f5b;--warn:#b5482a;
  --shadow:0 2px 10px rgba(80,45,20,.08);--r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1714;--card:#26201c;--ink:#f3e9df;--muted:#b3a294;--line:#3a312b;
  --accent:#f07a3e;--accent2:#f5a04a;--soft:#3d2a20;--ok:#5cc58b;--warn:#f08a6a;
  --shadow:0 2px 10px rgba(0,0,0,.35);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:26px;margin:2px 0 8px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;color:var(--ink);font-size:17px;padding:13px 0;outline:none;min-width:0}
.search .x{font-size:20px;color:var(--muted);padding:6px;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;white-space:nowrap;min-height:40px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.small{padding:6px 12px;font-size:14px;min-height:34px}
main{padding:6px 16px 20px}
.note{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13.5px;margin:6px 0 12px}
.count{font-size:13px;color:var(--muted);margin:4px 2px 8px}
.list{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.emo{flex:0 0 52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:28px}
.card .t{font-weight:650;font-size:16.5px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted);margin-top:4px}
.fav{margin-left:auto;font-size:22px;padding:8px;flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
td.n{white-space:nowrap;font-weight:600}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:17px;margin:18px 0 8px}
/* détail */
#detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;-webkit-overflow-scrolling:touch}
#detail.open{transform:none}
.dtop{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bg);z-index:2}
.round{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
.dwrap{padding:0 18px 40px}
.hero{font-size:64px;text-align:center;margin:0 0 4px}
.dtitle{font-size:24px;font-weight:750;text-align:center;margin:0 0 12px;letter-spacing:-.3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:18px}
.stat small{color:var(--muted);font-size:11.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.serv{display:flex;align-items:center;justify-content:space-between}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:22px;font-weight:700;color:var(--accent)}
ul.ing{list-style:none;padding:0;margin:8px 0 0}
ul.ing li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
ul.ing li:last-child{border:0}
ul.ing input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
ol.steps{padding-left:0;margin:6px 0 0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;padding:8px 0 8px 40px;position:relative}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12.5px;margin:2px 4px 2px 0}
.tip{border-left:4px solid var(--ok)}
.err{border-left:4px solid var(--warn)}
.big{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;text-align:center;margin:12px 0}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav button i{font-style:normal;font-size:22px}
nav button.on{color:var(--accent);font-weight:650}
/* minuteur */
#timer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#timer.open{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.clock{font-size:64px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 10px}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3 button{padding:12px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:14px;border-radius:14px;font-weight:700}
.go{background:var(--accent);color:#fff}.stop{background:var(--card);border:1px solid var(--line)!important}
#pill{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:11;background:var(--accent);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:var(--shadow);display:none;font-variant-numeric:tabular-nums}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.spec dt{color:var(--muted)}.spec dd{margin:0;font-weight:600}
a{color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.bdg{font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.bdg.p{background:#e3f3ea;color:#1f6b43}
@media (prefers-color-scheme:dark){.bdg.p{background:#1f3a2b;color:#8fe0b2}}
.chip .n{font-size:12px;opacity:.75;margin-left:4px}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.nutri div{background:var(--soft);border-radius:12px;padding:8px 2px;text-align:center}
.nutri b{display:block;font-size:17px}.nutri small{font-size:11.5px;color:var(--muted)}
.origin{text-align:center;font-size:14px;color:var(--muted);margin:-6px 0 12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:6px 0 2px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:650;font-size:15px}
.seg button.on{background:var(--accent);color:#fff}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0;box-shadow:var(--shadow)}
.day h4{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day h4 small{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right}
.slot{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.slot .lb{flex:0 0 42px;font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase}
.slot .rc{flex:1;min-width:0;text-align:left;font-size:15px;line-height:1.25}
.slot .rc small{display:block;color:var(--muted);font-size:12px}
.slot .add{flex:1;text-align:left;color:var(--accent);font-weight:650;font-size:15px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.btnrow{display:flex;gap:8px;margin:8px 0}
.btn{flex:1;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sug{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:12px 0;box-shadow:var(--shadow)}
.sug h3{margin:0 0 2px}.sug p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.mini{width:100%;font-size:12.5px;box-shadow:none;border:1px solid var(--line)}
.mini td,.mini th{padding:6px 5px}.mini td:first-child{white-space:nowrap}.mini td small{color:var(--muted)}
#pick,#slotpick{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#pick.open,#slotpick.open{display:flex}
#pick .sheet,#slotpick .sheet{max-height:85vh;overflow-y:auto}
.plist .card{padding:8px}.plist .emo{flex-basis:40px;height:40px;font-size:22px}
.sgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;margin-top:10px}
.sgrid button{padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;min-height:44px}
.sgrid button.full{background:var(--soft)}
.acc li{margin-bottom:8px}
</style>
</head>
<body>
<header id="hdr">
  <div class="top"><h1>Recettes <span>Airfryer</span></h1></div>
  <div class="sub">Valberg 11,5 L Flex · 2 zones · 80-200 °C</div>
  <div class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="Poulet, frites, chèvre, 15 min…" autocomplete="off" aria-label="Rechercher une recette"><button class="x" id="qx" aria-label="Effacer">✕</button></div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="subs" style="padding-top:6px"></div>
  <div class="chips" id="orig" style="padding-top:6px"></div>
  <div class="chips" id="nf" style="padding-top:6px"></div>
</header>
<main id="main"></main>

<section id="detail" aria-modal="true" role="dialog"></section>

<div id="timer"><div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">⏱️ Minuteur</b><button class="round" id="tclose" aria-label="Fermer">✕</button></div>
  <div class="clock" id="tclock">10:00</div>
  <div class="grid3" id="tpresets"></div>
  <div class="row"><button class="stop" id="tminus">− 1 min</button><button class="stop" id="tplus">+ 1 min</button></div>
  <div class="row"><button class="stop" id="treset">Arrêter</button><button class="go" id="tgo">Démarrer</button></div>
  <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">Garde la page ouverte : sur iPhone, le son peut être coupé si l'écran se verrouille. Le minuteur de l'appareil reste la référence.</p>
</div></div>
<button id="pill"></button>
<div id="pick"><div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px" id="picktitle">Choisir une recette</b><button class="round" id="pickclose" aria-label="Fermer">✕</button></div>
  <div class="search" style="margin:10px 0"><span aria-hidden="true">🔎</span><input id="pq" type="search" placeholder="Chercher une recette…" autocomplete="off" aria-label="Chercher une recette"></div>
  <div class="list plist" id="plist"></div>
</div></div>
<div id="slotpick"><div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">📅 Ajouter à ma semaine</b><button class="round" id="slotclose" aria-label="Fermer">✕</button></div>
  <div id="slottitle" style="font-size:14px;color:var(--muted);margin-top:4px"></div>
  <div class="sgrid" id="sgrid"></div>
</div></div>

<nav>
  <button data-tab="recettes" class="on"><i>🍽️</i>Recettes</button>
  <button data-tab="semaine"><i>📅</i>Semaine</button>
  <button data-tab="favoris"><i>♥</i>Favoris</button>
  <button data-tab="minuteur"><i>⏱️</i>Minuteur</button>
  <button data-tab="conseils"><i>💡</i>Conseils</button>
</nav>

<script src="recipes.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const CATS=[["all","Tout"],["regime","🥗 Régime / léger"],["proteines","💪 Protéinées"],["specialites","🌍 Spécialités"],["entrees","Entrées"],["plats","Plats"],["accomp","Accompagnements"],["desserts","Desserts"],["aperos","Apéritifs & snacks"],["petitdej","Petit-déjeuner"],["surgeles","Surgelés"],["rechauffer","Réchauffer"]];
const FLAGS={"Italie":"🇮🇹","Espagne":"🇪🇸","Maroc":"🇲🇦","Liban":"🇱🇧","Inde":"🇮🇳","Japon":"🇯🇵","Chine":"🇨🇳","Vietnam":"🇻🇳","Thaïlande":"🇹🇭","Corée":"🇰🇷","Mexique":"🇲🇽","USA":"🇺🇸","Grèce":"🇬🇷","Turquie":"🇹🇷","Belgique":"🇧🇪","Royaume-Uni":"🇬🇧",
 "Provence":"🌻","Bretagne":"⚓","Normandie":"🍏","Lorraine / Alsace":"🥨","Paris / Île-de-France":"🗼","Lyon":"🦁","Sud-Ouest":"🦆","Savoie / Dauphiné":"🏔️","Nord":"🍺","Pays basque":"🌶️","Bourgogne":"🍇","Corse":"🏝️","Antilles / Réunion":"🌴"};
const originKey=r=>r.o?(r.o[1]||r.o[0]):"";
const originLabel=r=>r.o?((FLAGS[originKey(r)]||"🌍")+" "+(r.o[1]?r.o[1]+" (France)":r.o[0])):"";
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],MEALS=["Midi","Soir"];
const VEG=new Set(["legumineuse","soja","oeuf","fromage","legume"]);
const MAIN=r=>VEG.has(r.p)?"vege":r.p;
const PNAME={volaille:"Volaille",viande:"Viande",poisson:"Poisson",vege:"Végétarien",legumineuse:"Légumineuses",soja:"Soja",oeuf:"Œufs",fromage:"Fromage",legume:"Légumes"};
const SUBS=[["","Tous les plats"],["viande","Viande"],["volaille","Volaille"],["poisson","Poisson"],["vegetarien","Végétarien"]];
const TIMES=[[0,"Toutes durées"],[15,"< 15 min"],[30,"< 30 min"]];
const CATNAME=Object.fromEntries(CATS);const SUBNAME=Object.fromEntries(SUBS);
const st={tab:"recettes",cat:"all",sub:"",maxt:0,q:"",p30:false,k400:false,sort:"",spe:"monde",origin:""};
let favs=[];try{favs=JSON.parse(localStorage.getItem("af-favs")||"[]")}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("af-favs",JSON.stringify(favs))}catch(e){}};
const norm=s=>(s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=r=>r.prep+r.time+(r.pre?3:0);
RECIPES.forEach(r=>{r._s=" "+norm([r.t,r.ing.join(" "),r.tags.join(" "),CATNAME[r.c],SUBNAME[r.s]||"",r.x.map(x=>CATNAME[x]).join(" "),r.x.includes("regime")?"regime leger light":"",r.x.includes("proteines")?"proteines proteine sport":"",r.o?r.o.join(" ")+" specialite version airfryer "+(r.o[1]?"france":""):"",r.v.join(" ")].join(" ")).replace(/[^a-z0-9]+/g," ")});
const inCat=(r,c)=>c==="all"||r.c===c||r.x.includes(c)||(c==="specialites"&&!!r.o);
const isFrozenRecipe=r=>r.tags.includes("surgele");

function chips(){
  const list=st.tab==="recettes";
  $("#cats").innerHTML=CATS.map(([k,v])=>`<button class="chip ${st.cat===k?"on":""}" data-cat="${k}">${v}${k!=="all"&&k!=="surgeles"?`<span class="n">${RECIPES.filter(r=>inCat(r,k)).length}</span>`:""}</button>`).join("");
  let h="";
  if(st.cat==="plats")h+=SUBS.map(([k,v])=>`<button class="chip small ${st.sub===k?"on":""}" data-sub="${k}">${v}</button>`).join("");
  if(st.cat==="specialites")h+=`<div class="seg" style="flex:1;margin:0"><button class="${st.spe==="monde"?"on":""}" data-spe="monde">🌍 Monde</button><button class="${st.spe==="france"?"on":""}" data-spe="france">🇫🇷 France</button></div>`;
  else if(st.cat!=="surgeles"&&st.cat!=="rechauffer")h+=TIMES.map(([k,v])=>`<button class="chip small ${st.maxt===k?"on":""}" data-t="${k}">${v}</button>`).join("");
  $("#subs").innerHTML=h;$("#subs").style.display=(st.tab==="recettes"||st.tab==="favoris")&&h&&!st.q?"flex":"none";
  let o="";
  if(list&&st.cat==="specialites"&&!st.q){
    const cnt={};RECIPES.filter(r=>r.o&&((st.spe==="france")===(r.o[0]==="France"))).forEach(r=>{const k=originKey(r);cnt[k]=(cnt[k]||0)+1});
    o=`<button class="chip small ${st.origin===""?"on":""}" data-orig="">Toutes</button>`+Object.keys(cnt).sort((a,b)=>a.localeCompare(b,"fr")).map(k=>`<button class="chip small ${st.origin===k?"on":""}" data-orig="${esc(k)}">${FLAGS[k]||"🌍"} ${esc(k)}<span class="n">${cnt[k]}</span></button>`).join("");
  }
  $("#orig").innerHTML=o;$("#orig").style.display=o?"flex":"none";
  const nf=(st.tab==="recettes"||st.tab==="favoris")&&st.cat!=="surgeles"&&st.cat!=="rechauffer";
  $("#nf").innerHTML=nf?`<button class="chip small ${st.p30?"on":""}" data-nf="p30">💪 + de 30 g protéines</button><button class="chip small ${st.k400?"on":""}" data-nf="k400">🔥 - de 400 kcal</button><button class="chip small ${st.sort==="kcal"?"on":""}" data-sort="kcal">↑ Moins de kcal</button><button class="chip small ${st.sort==="prot"?"on":""}" data-sort="prot">↓ Plus de protéines</button>`:"";
  $("#nf").style.display=nf?"flex":"none";
  $("#cats").style.display=list?"flex":"none";
}
function filtered(){
  const words=norm(st.q).replace(/[^a-z0-9]+/g," ").split(/\s+/).filter(Boolean);
  const out=RECIPES.filter(r=>{
    if(st.tab==="favoris"&&!favs.includes(r.id))return false;
    if(st.tab==="recettes"&&!words.length){
      if(st.cat==="surgeles"){if(!isFrozenRecipe(r))return false}
      else if(!inCat(r,st.cat))return false;
      if(st.cat==="plats"&&st.sub&&r.s!==st.sub)return false;
      if(st.cat==="specialites"){if((st.spe==="france")!==(r.o[0]==="France"))return false;if(st.origin&&originKey(r)!==st.origin)return false}
    }
    if(st.maxt&&st.cat!=="specialites"&&total(r)>=st.maxt)return false;

function scaleLine(line,k){
  if(k===1)return esc(line);
  const m=line.match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)(\s.*)$/);

  let v=m[1].includes("/")?(+m[1].split("/")[0])/(+m[1].split("/")[1]):parseFloat(m[1].replace(",","."));
  v*=k;
  let out;
  if(v>=10)out=String(Math.round(v));
  else{const q=Math.round(v*4)/4;const fr={0.25:"1/4",0.5:"1/2",0.75:"3/4"};const ip=Math.floor(q),dp=+(q-ip).toFixed(2);
    out=q===0?"1 pincée":(ip?String(ip):"")+(dp?(ip?" ":"")+fr[dp]:"")}
  return `<b>${out}</b>${esc(m[2])}`;
}

function genWeek(pool,rng,veg){
  const key=r=>veg?r.p:MAIN(r);
  for(let a=0;a<300;a++){
    const used=new Set(),out=[],cnt={};let ok=true;
    for(let i=0;i<14;i++){
      const prev=out[i-1];
      let c=pool.filter(r=>!used.has(r.id)&&(!prev||key(r)!==key(prev)));
      if(!c.length){ok=false;break}
      const min=Math.min(...c.map(r=>cnt[key(r)]||0));c=c.filter(r=>(cnt[key(r)]||0)===min);
      const r=c[Math.floor(rng()*c.length)];out.push(r);used.add(r.id);cnt[key(r)]=(cnt[key(r)]||0)+1;
    }
    if(ok)return out.map(r=>r.id);

function weekView(){
  let h=`<h2>📅 Ma semaine</h2><div class="btnrow"><button class="btn pri" id="wsurprise">🎲 Me surprendre</button><button class="btn" id="wclear">🗑️ Vider</button></div>`;
  h+=`<p style="font-size:12.5px;color:var(--muted);margin:0 0 4px">Touche « + Ajouter » pour choisir un plat, 🔀 pour l'échanger contre un plat proche (même type de protéine), ✕ pour le retirer. Totaux : valeurs estimées par portion, midi + soir, pour les plats seuls (ajoute tes accompagnements).</p>`;
  DAYS.forEach((d,di)=>{
    const ids=[week[di*2],week[di*2+1]].filter(Boolean);const t=dayTot(ids);
    h+=`<div class="day"><h4>${d}<small>${totTxt(t)}</small></h4>`;
    MEALS.forEach((m,mi)=>{const i=di*2+mi,r=byId[week[i]];
      h+=`<div class="slot"><span class="lb">${m}</span>${r?`<button class="rc" data-open="${r.id}">${r.e} ${esc(r.t)}<small>${r.p?PNAME[MAIN(r)]+" · ":""}${r.n?r.n[0]+" kcal · "+r.n[1]+" g prot.":""}</small></button><button class="ib" data-wshuf="${i}" aria-label="Échanger">🔀</button><button class="ib" data-wdel="${i}" aria-label="Retirer">✕</button>`:`<button class="add" data-wadd="${i}">+ Ajouter</button>`}</div>`;});
    h+=`</div>`;
  });
  h+=`<h2>💡 Suggestions de menus</h2><p style="font-size:13px;color:var(--muted);margin:-4px 0 6px">Des semaines toutes prêtes, renouvelées chaque semaine. Aucun plat ne se répète, et la même protéine ne revient jamais deux repas de suite.</p>`;
  SUGG.forEach(s=>{
    h+=`<div class="sug" id="sug-${s.k}"><h3>${s.name}</h3><p>${s.desc}</p><table class="mini"><tr><th>Jour</th><th>Midi</th><th>Soir</th></tr>${DAYS.map((d,di)=>{const a=byId[s.ids[di*2]],b=byId[s.ids[di*2+1]];const t=dayTot([a.id,b.id]);return `<tr><td><b>${d.slice(0,3)}</b>${t.any?`<br><small>${t.k} kcal<br>${t.p} g prot.</small>`:""}</td><td>${a.e} ${esc(a.t)}</td><td>${b.e} ${esc(b.t)}</td></tr>`}).join("")}</table><button class="big" data-wuse="${s.k}" style="margin-bottom:0">Utiliser ce menu</button></div>`;
  });
  return h;
}
function fillWeek(ids){if(week.some(Boolean)&&!confirm("Remplacer le menu actuel de ta semaine ?"))return;week=ids.slice();saveWeek();render();window.scrollTo(0,0)}
function shuffleSlot(i){
  const cur=byId[week[i]];if(!cur)return;
  const used=new Set(week.filter(Boolean));const nb=[byId[week[i-1]],byId[week[i+1]]].filter(Boolean);
  const vegWeek=week.filter(Boolean).every(id=>VEG.has((byId[id]||{}).p));
  const key=r=>vegWeek?r.p:MAIN(r);
  let c=MEALPOOL.filter(r=>!used.has(r.id)&&key(r)===key(cur));
  if(cur.n){const near=c.filter(r=>r.n&&Math.abs(r.n[0]-cur.n[0])<=150);if(near.length)c=near}
  if(!c.length)c=MEALPOOL.filter(r=>!used.has(r.id)&&nb.every(n=>key(n)!==key(r)));
  if(!c.length)return;
  week[i]=c[Math.floor(Math.random()*c.length)].id;saveWeek();render();
}
let pickSlot=-1;
function openPick(i){pickSlot=i;$("#picktitle").textContent=`${DAYS[i>>1]} · ${MEALS[i%2]}`;$("#pq").value="";drawPick();$("#pick").classList.add("open")}
function drawPick(){
  const words=norm($("#pq").value).replace(/[^a-z0-9]+/g," ").split(/\s+/).filter(Boolean);
  const list=(words.length?RECIPES:MEALPOOL).filter(r=>words.every(w=>r._s.includes(" "+w))).slice(0,80);
  $("#plist").innerHTML=list.length?list.map(r=>`<button class="card" data-pickr="${r.id}"><div class="emo">${r.e}</div><div style="min-width:0"><div class="t" style="font-size:15px">${esc(r.t)}</div><div class="meta">${r.p?`<span>${PNAME[MAIN(r)]}</span>`:""}${r.n?`<span>🔥 ${r.n[0]} kcal</span><span>💪 ${r.n[1]} g</span>`:""}</div></div></button>`).join(""):`<div class="empty">Aucune recette.</div>`;
}
function openSlotPick(r){
  $("#slottitle").textContent=`${r.e} ${r.t}`;
  $("#sgrid").innerHTML=`<span></span><b style="text-align:center;font-size:13px">Midi</b><b style="text-align:center;font-size:13px">Soir</b>`+DAYS.map((d,di)=>`<b style="font-size:13px">${d.slice(0,3)}</b>`+[0,1].map(mi=>{const i=di*2+mi,x=byId[week[i]];return `<button class="${x?"full":""}" data-slotset="${i}">${x?x.e+" "+esc(x.t.length>18?x.t.slice(0,17)+"…":x.t):"+ Libre"}</button>`}).join("")).join("");
  $("#slotpick").classList.add("open");
}
/* minuteur */
let tLeft=600,tSet=600,tEnd=0,tInt=null;
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function tDraw(){const left=tEnd?(tEnd-Date.now())/1000:tLeft;$("#tclock").textContent=fmt(left);$("#tgo").textContent=tEnd?"Pause":"Démarrer";
  const p=$("#pill");if(tEnd){p.style.display="block";p.textContent="⏱️ "+fmt(left)}else p.style.display=tLeft<tSet&&tLeft>0?"block":"none",p.textContent="⏸ "+fmt(tLeft);}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;for(let i=0;i<6;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.3,t+i*.4);g.gain.exponentialRampToValueAtTime(.001,t+i*.4+.3);o.start(t+i*.4);o.stop(t+i*.4+.3)}}catch(e){} if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);}
function tTick(){const left=(tEnd-Date.now())/1000;if(left<=0){clearInterval(tInt);tInt=null;tEnd=0;tLeft=0;tDraw();$("#tclock").textContent="Terminé !";$("#pill").style.display="none";beep();openTimer();return}tDraw()}
function tStart(){if(tEnd){tLeft=(tEnd-Date.now())/1000;tEnd=0;clearInterval(tInt);tInt=null;tDraw();return}
  if(tLeft<=0)tLeft=tSet;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  tEnd=Date.now()+tLeft*1000;tInt=setInterval(tTick,250);tDraw();}
function tSetMin(m){if(tEnd){clearInterval(tInt);tInt=null;tEnd=0}tSet=tLeft=m*60;tDraw()}
function openTimer(){$("#timer").classList.add("open");tDraw()}
$("#tpresets").innerHTML=[3,5,8,10,12,15,20,25].map(m=>`<button data-min="${m}">${m} min</button>`).join("");
$("#tpresets").onclick=e=>{const b=e.target.closest("[data-min]");if(b)tSetMin(+b.dataset.min)};
$("#tplus").onclick=()=>{if(tEnd)tEnd+=60000;else{tLeft+=60;tSet=Math.max(tSet,tLeft)}tDraw()};
$("#tminus").onclick=()=>{if(tEnd)tEnd=Math.max(Date.now()+1000,tEnd-60000);else tLeft=Math.max(60,tLeft-60);tDraw()};
$("#treset").onclick=()=>{clearInterval(tInt);tInt=null;tEnd=0;tLeft=tSet;tDraw();$("#pill").style.display="none"};
$("#tgo").onclick=tStart;$("#tclose").onclick=()=>$("#timer").classList.remove("open");
$("#timer").onclick=e=>{if(e.target.id==="timer")$("#timer").classList.remove("open")};
$("#pill").onclick=openTimer;
/* événements */
document.addEventListener("click",e=>{
  const fb=e.target.closest("[data-fav]");
  if(fb){e.stopPropagation();const id=fb.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFavs();if(cur)drawDetail();render();return}
  const c=e.target.closest("[data-cat]");if(c){st.cat=c.dataset.cat;st.sub="";st.origin="";st.q="";$("#q").value="";$("#qx").style.display="none";render();c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});window.scrollTo(0,0);return}
  const s=e.target.closest("[data-sub]");if(s){st.sub=s.dataset.sub;render();return}
  const t=e.target.closest("[data-t]");if(t){st.maxt=+t.dataset.t;render();return}
  const sp=e.target.closest("[data-spe]");if(sp){st.spe=sp.dataset.spe;st.origin="";render();return}
  const og=e.target.closest("[data-orig]");if(og){st.origin=og.dataset.orig;render();return}
  const nf=e.target.closest("[data-nf]");if(nf){st[nf.dataset.nf]=!st[nf.dataset.nf];render();return}
  const so=e.target.closest("[data-sort]");if(so){st.sort=st.sort===so.dataset.sort?"":so.dataset.sort;render();return}
  const wa=e.target.closest("[data-wadd]");if(wa){openPick(+wa.dataset.wadd);return}
  const wd=e.target.closest("[data-wdel]");if(wd){week[+wd.dataset.wdel]=null;saveWeek();render();return}
  const ws=e.target.closest("[data-wshuf]");if(ws){shuffleSlot(+ws.dataset.wshuf);return}
  const wu=e.target.closest("[data-wuse]");if(wu){const s=SUGG.find(x=>x.k===wu.dataset.wuse);if(s)fillWeek(s.ids);return}
  if(e.target.closest("#wsurprise")){const ids=genWeek(MEALPOOL,Math.random,false);if(ids)fillWeek(ids);return}
  if(e.target.closest("#wclear")){if(week.some(Boolean)&&confirm("Vider toute la semaine ?")){week=Array(14).fill(null);saveWeek();render()}return}
  const pr=e.target.closest("[data-pickr]");if(pr){week[pickSlot]=pr.dataset.pickr;saveWeek();$("#pick").classList.remove("open");render();return}
  if(e.target.closest("#pickclose")||e.target.id==="pick"){$("#pick").classList.remove("open");return}
  if(e.target.closest("#dweek")){openSlotPick(cur);return}
  const ss=e.target.closest("[data-slotset]");if(ss){week[+ss.dataset.slotset]=cur.id;saveWeek();openSlotPick(cur);render();return}
  if(e.target.closest("#slotclose")||e.target.id==="slotpick"){$("#slotpick").classList.remove("open");return}
  const o=e.target.closest("[data-open]");if(o){openDetail(o.dataset.open);return}
  if(e.target.closest("#dback")){history.length>1&&location.hash?history.back():closeDetail();return}
  if(e.target.closest("#sm")){if(srv>1){srv--;drawDetail()}return}
  if(e.target.closest("#sp")){if(srv<16){srv++;drawDetail()}return}
  if(e.target.closest("#dtimer")){tSetMin(cur.time);openTimer();return}
  const n=e.target.closest("nav button");
  if(n){const tab=n.dataset.tab;if(tab==="minuteur"){openTimer();return}
    document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===n));st.tab=tab;
    $("#hdr .search").style.display=tab==="conseils"||tab==="semaine"?"none":"flex";render();window.scrollTo(0,0)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const o=e.target.closest&&e.target.closest("[data-open]");if(o)openDetail(o.dataset.open)}});
$("#pq").addEventListener("input",drawPick);
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();$("#qx").style.display=st.q?"block":"none";render()});
$("#qx").onclick=()=>{$("#q").value="";st.q="";$("#qx").style.display="none";render();$("#q").focus()};
window.addEventListener("popstate",()=>{const m=location.hash.match(/^#r\/(.+)$/);if(m)openDetail(m[1],false);else closeDetail()});
render();
const m0=location.hash.match(/^#r\/(.+)$/);if(m0)openDetail(m0[1],false);
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
